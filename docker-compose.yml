services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: optiprompt
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - optiprompt_postgres_data:/var/lib/postgresql/data

volumes:
  optiprompt_postgres_data:
